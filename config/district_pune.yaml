# =============================================================================
# District configuration — Pune (Maharashtra)
# Every district-specific constant lives here. To onboard a new district, copy
# this file, change the values, and run:
#   python -m src.pipeline.run --config config/district_<name>.yaml
# =============================================================================

district:
  key: pune
  name: Pune
  name_mr: पुणे
  name_hi: पुणे
  state: Maharashtra
  state_lgd: 27
  district_lgd: 490
  # Blocks excluded from panchayat-level modelling (urban blocks with no or
  # almost no Gram Panchayats). They are still shown on the map.
  exclude_blocks: ["PUNE CITY"]

crs:
  storage: "EPSG:4326"
  metric: "EPSG:32643"          # UTM zone 43N — area, slope, distance

# Analysis bounding box (lon/lat) — district bounds + ~0.1° buffer
bbox:
  west: 73.20
  south: 17.80
  east: 75.30
  north: 19.50

boundaries:
  # Pre-extracted LGD layers (urbanmorph/geodata). See src/ingest/boundaries.py
  # for how to re-extract them for another district.
  source_panchayats: data/pune/raw/boundaries/pune_panchayats.geojson
  source_blocks: data/pune/raw/boundaries/pune_blocks.geojson
  lgd_blocks_parquet_url: "https://github.com/urbanmorph/geodata/raw/main/LGD_Blocks.parquet"
  lgd_panchayats_parquet_url: "https://github.com/urbanmorph/geodata/raw/main/LGD_panchayats.parquet"

period:
  start: "2024-06-01"           # first date with archived ECMWF IFS 0.25° lead-1..5 forecasts
  end: "2026-08-31"             # last date with CHIRPS v2.0 *final* daily data at audit time

validation:
  # Temporal hold-out: everything on/after this date is never seen in training.
  test_start: "2026-01-01"
  # Calibration = every 5th week before test_start (blocked, 2-day buffers) - see src/models/train.py
  # Fraction of Gram Panchayats held out spatially (grouped, never trained on)
  spatial_holdout_fraction: 0.20
  random_seed: 42
  bootstrap_samples: 300

forecast:
  provider: open_meteo_previous_runs
  model: ecmwf_ifs025           # ECMWF IFS open data, 0.25° (~27 km) — the coarse NWP
  label: "ECMWF IFS 0.25°"
  grid_resolution_deg: 0.25
  lead_days: [1, 2, 3, 4, 5]
  timezone: "Asia/Kolkata"

ground_truth:
  rainfall:
    source: chirps_v2_daily_p05  # 0.05° gauge-blended satellite rainfall (CHC/UCSB)
    label: "satellite rainfall (CHIRPS)"
    resolution_deg: 0.05
    prelim_latency_days: 2       # CHIRPS-prelim appears ~2 days after the fact
  temperature_humidity_wind:
    source: era5_land            # 0.1° land reanalysis via Open-Meteo archive
    label: "ERA5 reanalysis weather"
    resolution_deg: 0.1
  independent_validation:
    - imd_gridded_rain_025       # IMD 0.25° gauge-only gridded rainfall (never used in training)
    - user_station_csv           # real AWS/rain-gauge CSVs dropped into data/raw/stations/
  stations:
    day_convention: calendar     # "imd0830": station day ends 08:30 IST (shifted one day back); "calendar": 00-24 local

static:
  dem: copernicus_glo30          # Copernicus DEM GLO-30 (30 m), AWS open data
  lulc: esa_worldcover_2021_v200 # 10 m
  climatology: chpclim_v2        # CHIRPS monthly climatology (0.05°)
  # Prevailing south-west monsoon low-level flow direction (degrees FROM),
  # used for the windward-exposure index.
  monsoon_flow_from_deg: 250
  # Western Ghats crest search window (longitude) used to trace the crest line
  ghat_crest_search_lon: [73.30, 73.95]

ndvi:
  latency_days: 8                # a MODIS 16-day composite is usable this long after its period ends
  asof_tolerance_days: 40        # oldest composite accepted as "current" for an issue date
  search_lookback_days: 40       # STAC search starts this long before period.start
  refresh_when_older_than_days: 20  # daily job re-fetches NDVI when the newest usable composite is older than this

nowcast:
  steps_15min: 24                # Open-Meteo minutely_15 steps (24 = next 6 h)

operational:
  # Live forecast: regular Open-Meteo forecast API with the same model
  live_forecast_model: ecmwf_ifs025
  # Operational horizon: today (0) + 7 days. The model was trained and validated on leads 1-5
  # (forecast.lead_days); day 0 and days 6-7 are downscaled with the same model and flagged as
  # outside the validated range. Advisories use the validated leads only.
  live_lead_days: [0, 1, 2, 3, 4, 5, 6, 7]
  refresh_hour_local: 6            # ECMWF 00 UTC run is on Open-Meteo by ~05:30 IST; re-issue daily after this hour
  refresh_check_minutes: 15        # how often the server checks whether today's forecast exists
  history_backfill_days: 3         # previous issues needed for fc_rain_ante3 (lead-1 forecasts of issue-3..issue-1)
  antecedent_carry_forward_days: 10  # CHIRPS-prelim lag tolerance for ante_obs7_lag3 at inference
  input_gap_tolerance: 0.10        # flag an input only when its coverage is this far below the seasonal norm
  default_language: mr
  languages: [mr, en, hi]
