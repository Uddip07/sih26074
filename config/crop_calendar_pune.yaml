# =============================================================================
# Pune district crop calendar (feature F8)
# Sources: Maharashtra Dept. of Agriculture district crop plans, MPKV Rahuri /
# KVK Baramati & Narayangaon package of practices, FAO-56 Table 12 (Kc).
# Dates are typical windows (MM-DD); windows may wrap across 31 Dec.
# stage_type drives the generic rules: sowing | vegetative | flowering |
#   fruit_development | maturity | harvest | rest
# Officers can edit blocks, windows or add crops without touching code.
# =============================================================================

