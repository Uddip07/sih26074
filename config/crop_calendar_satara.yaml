# =============================================================================
# Satara district crop calendar (F32 second district). Same crop/stage definitions as Pune
# (Western Maharashtra agro-climatic zones share the package of practices); block lists from
# the Satara district crop plan: paddy in the Ghat blocks (Mahabaleshwar, Jawali, Patan),
# sugarcane in the Krishna valley (Karad, Satara, Wai), rain-shadow millets / pulses /
# pomegranate in Man, Khatav and Phaltan.
# =============================================================================
