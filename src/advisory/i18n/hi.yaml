crop_advisory: "फसलवार सलाह"
disease_advisory: "कीट एवं रोग चेतावनी"
footer: "ECMWF प्रखंड पूर्वानुमान को भू-आकृति, भूमि उपयोग और वर्षा जलवायु के आधार पर पंचायत स्तर पर लाया गया है। ज़िला कृषि मौसम इकाई (DAMU) द्वारा जारी। IMD के नवीनतम बुलेटिन से पुष्टि करें।"
reviewed_by: "समीक्षक"
not_reviewed: "स्वचालित सलाह, कृषि मौसम अधिकारी द्वारा अभी समीक्षा नहीं हुई"

summary_dry: "अगले {n} दिनों में मौसम मुख्यतः शुष्क रहने की संभावना है (कुल {total} मिमी)।"
summary_light: "अगले {n} में से {n_days} दिनों में हल्की वर्षा की संभावना है (कुल {total} मिमी)।"
summary_moderate: "अगले {n} में से {n_days} दिनों में मध्यम वर्षा की संभावना है (कुल {total} मिमी)।"
summary_heavy: "भारी वर्षा संभव; {n} दिनों में कुल लगभग {total} मिमी वर्षा।"
summary_temp: "अधिकतम तापमान {tmax_lo}-{tmax_hi} °से और न्यूनतम {tmin_lo}-{tmin_hi} °से रहेगा।"

normal_title: "सामान्य मौसम"
normal_text: "कोई प्रतिकूल मौसम अपेक्षित नहीं है। खेती के सामान्य कार्य जारी रखें।"

heavy_rain_title: "भारी वर्षा की चेतावनी"
heavy_rain_text: "{day} को लगभग {rain} मिमी वर्षा अपेक्षित ({thr} मिमी या अधिक की संभावना: {prob}%)।"
heavy_rain_action: "खेत की नालियाँ खोलें, बुवाई, खाद और छिड़काव टालें, कटी फसल और चारा ढककर रखें।"
waterlogging_title: "जलभराव का खतरा"
waterlogging_text: "समतल, भारी (चिकनी) मिट्टी वाले खेतों में {window} दिनों में {rain3} मिमी वर्षा अपेक्षित (ढलान {slope}°, चिकनी मिट्टी {clay}%)।"
waterlogging_action: "मेड़-नाली बनाकर या नाली खोलकर 24 घंटे में जमा पानी निकालें; गीले खेत में मशीन न ले जाएँ।"
dry_spell_title: "शुष्क अवधि - सिंचाई सलाह"
dry_spell_text: "अगले 3 दिनों में केवल {rain3} मिमी वर्षा अपेक्षित; फसल की जल आवश्यकता लगभग {etc} मिमी है।"
dry_spell_action: "लगभग {irr} मिमी जीवनरक्षक सिंचाई करें, अधिमानतः ड्रिप/स्प्रिंकलर से सुबह या शाम; नमी बचाने के लिए मल्चिंग करें।"
sowing_ok_title: "बुवाई का उपयुक्त समय"
sowing_ok_text: "मिट्टी में पर्याप्त नमी है: लगभग {cum} मिमी वर्षा हुई और अपेक्षित है।"
sowing_ok_action: "खरीफ बुवाई करें; उपचारित बीज का प्रयोग करें और ढलान पर समोच्च बुवाई करें।"
sowing_wait_title: "बुवाई में जल्दी न करें"
sowing_wait_text: "अब तक केवल लगभग {cum} मिमी वर्षा; सुरक्षित बुवाई के लिए कम से कम {need} मिमी आवश्यक।"
sowing_wait_action: "सूखी मिट्टी में बुवाई न करें; पर्याप्त वर्षा तक प्रतीक्षा करें।"
spray_ok_title: "छिड़काव के लिए उपयुक्त दिन"
spray_ok_text: "कीटनाशक / फफूंदनाशक छिड़काव के लिए उपयुक्त दिन: {days}।"
spray_ok_action: "शांत हवा में सुबह छिड़काव करें; वर्षा से 6 घंटे पहले छिड़काव न करें।"
spray_no_title: "छिड़काव टालें"
spray_no_text: "आगामी सभी दिनों में वर्षा या तेज़ हवा अपेक्षित है।"
spray_no_action: "छिड़काव और पर्णीय खाद टालें; दवा बह जाएगी या उड़ जाएगी।"
fert_avoid_title: "खाद की टॉप-ड्रेसिंग टालें"
fert_avoid_text: "अगले 48 घंटों में {rain2} मिमी वर्षा अपेक्षित है।"
fert_avoid_action: "तेज़ वर्षा थमने तक यूरिया / टॉप-ड्रेसिंग न करें, वरना पोषक तत्व बह जाएँगे।"
heat_title: "गर्मी का तनाव"
heat_text: "{day} को अधिकतम तापमान {tmax} °से तक पहुँचने की संभावना।"
heat_action: "शाम को सिंचाई करें, पशुओं को छाया व पानी दें, दोपहर 12 से 4 बजे तक खेत का काम टालें।"
cold_title: "शीत लहर"
cold_text: "{day} को न्यूनतम तापमान {tmin} °से तक गिर सकता है।"
cold_action: "शाम को हल्की सिंचाई करें, नर्सरी ढकें, पशुओं को रात में आश्रय में रखें।"
frost_title: "पाले का खतरा"
frost_text: "{day} को न्यूनतम तापमान {tmin} °से तक गिर सकता है; निचली घाटी के खेतों में अधिक खतरा।"
frost_action: "पिछली शाम सिंचाई करें, पौध ढकें, भोर से पहले हवा की दिशा में धुआँ करें।"
thunder_title: "आँधी और बिजली"
thunder_text: "{day} को गरज के साथ वर्षा संभव ({thr} मिमी या अधिक की संभावना: {prob}%)।"
thunder_action: "आँधी के समय खुले खेत और पेड़ों के नीचे न रुकें; पशुओं को अंदर रखें; कटी फसल सुरक्षित रखें।"
wind_title: "तेज़ हवा"
wind_text: "{day} को {wind} किमी/घंटा तक की हवा चलने की संभावना।"
wind_action: "गन्ना, केला जैसी ऊँची फसलों को सहारा दें; छिड़काव न करें; पॉलीहाउस व शेडनेट सुरक्षित करें।"
pest_fungal_title: "कीट व फफूंद रोग का खतरा"
pest_fungal_text: "गर्म और आर्द्र मौसम ({tmax} °से तक, आर्द्रता {rh}%) कीटों व फफूंद रोगों के अनुकूल है।"
pest_fungal_action: "फसल की नियमित निगरानी करें; शुष्क, शांत सुबह आवश्यकतानुसार निवारक छिड़काव करें।"
harvest_ok_title: "कटाई का उपयुक्त समय"
harvest_ok_text: "{n} शुष्क दिन अपेक्षित - {crop} की कटाई और सुखाने के लिए उपयुक्त।"
harvest_ok_action: "पकी फसल काटें और भंडारण से पहले अच्छी तरह सुखाएँ।"
harvest_no_title: "कटाई टालें"
harvest_no_text: "{crop} की कटाई अवस्था में वर्षा की संभावना है।"
harvest_no_action: "कटाई टालें; कटी उपज को ढके, ऊँचे स्थान पर रखें।"
crop_stage_line: "{crop} - {stage}"

disease_title: "{crop}: {disease} का खतरा ({level})"
risk_levels: {1: कम, 2: मध्यम, 3: अधिक}
