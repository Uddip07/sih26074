  potato_late_blight: {name: "उशिरा येणारा करपा", action: "त्वरित प्रतिबंधात्मक बुरशीनाशक फवारा; पावसानंतर पुन्हा फवारा."}
  soybean_rust: {name: "तांबेरा", action: "खालच्या पानांची पाहणी करा; पहिले डाग दिसताच शिफारसीत बुरशीनाशक फवारा."}
  wheat_rust: {name: "तांबेरा", action: "प्रतिकारक वाण वापरा; तांबेरा दिसताच शिफारसीत बुरशीनाशक फवारा."}

