crop_advisory: "पीकनिहाय सल्ला"
disease_advisory: "कीड व रोग इशारा"
footer: "ECMWF तालुका अंदाज भूरचना, जमीन वापर व पर्जन्य सरासरीच्या आधारे ग्रामपंचायत स्तरावर आणला आहे. जिल्हा कृषी हवामान केंद्र (DAMU) यांच्याद्वारे जारी. IMD चा ताजा अंदाज पाहून खात्री करा."
reviewed_by: "तपासणी"
not_reviewed: "स्वयंचलित सल्ला, कृषी हवामान अधिकाऱ्यांनी अद्याप तपासलेला नाही"

summary_dry: "पुढील ५ दिवस हवामान मुख्यतः कोरडे राहण्याची शक्यता आहे (एकूण {total} मिमी)."
summary_light: "पुढील ५ पैकी {n_days} दिवस हलक्या पावसाची शक्यता आहे (एकूण {total} मिमी)."
summary_moderate: "पुढील ५ पैकी {n_days} दिवस मध्यम पावसाची शक्यता आहे (एकूण {total} मिमी)."
summary_heavy: "मुसळधार पावसाची शक्यता; ५ दिवसांत एकूण सुमारे {total} मिमी पाऊस."
summary_temp: "कमाल तापमान {tmax_lo}-{tmax_hi} °से व किमान तापमान {tmin_lo}-{tmin_hi} °से राहील."

normal_title: "सामान्य हवामान"
normal_text: "कोणताही प्रतिकूल हवामान इशारा नाही. शेतीची नेहमीची कामे सुरू ठेवा."

heavy_rain_title: "मुसळधार पावसाचा इशारा"
heavy_rain_text: "{day} रोजी सुमारे {rain} मिमी पावसाची शक्यता (६४.५ मिमी किंवा अधिक पावसाची शक्यता: {prob}%)."
heavy_rain_action: "शेतातील चर मोकळे करा, पेरणी, खत व फवारणी पुढे ढकला, काढलेले पीक व चारा झाकून ठेवा."
waterlogging_title: "शेतात पाणी साचण्याचा धोका"
waterlogging_text: "सपाट व भारी (चिकणमाती) जमिनीत ३ दिवसांत {rain3} मिमी पाऊस अपेक्षित (उतार {slope}°, चिकणमाती {clay}%)."
waterlogging_action: "सरी-वरंबे किंवा चर काढून साचलेले पाणी २४ तासांत बाहेर काढा; ओल्या शेतात यंत्रे नेऊ नका."
dry_spell_title: "पावसाचा खंड - सिंचन सल्ला"
dry_spell_text: "पुढील ३ दिवसांत फक्त {rain3} मिमी पाऊस अपेक्षित; पिकाची पाण्याची गरज सुमारे {etc} मिमी आहे."
dry_spell_action: "सुमारे {irr} मिमी संरक्षित पाणी द्या, शक्यतो ठिबक/तुषार सिंचनाने सकाळी किंवा संध्याकाळी; ओलावा टिकवण्यासाठी आच्छादन करा."
sowing_ok_title: "पेरणीस योग्य वेळ"
sowing_ok_text: "जमिनीत पुरेसा ओलावा आहे: सुमारे {cum} मिमी पाऊस झाला व अपेक्षित आहे."
sowing_ok_action: "खरीप पेरणी करावी; बीजप्रक्रिया केलेले बियाणे वापरा व उताराच्या आडवी पेरणी करा."
sowing_wait_title: "पेरणीची घाई करू नका"
sowing_wait_text: "आतापर्यंत फक्त सुमारे {cum} मिमी पाऊस; सुरक्षित पेरणीसाठी किमान ६५ मिमी पाऊस आवश्यक."
sowing_wait_action: "कोरड्या जमिनीत पेरणी करू नका; पुरेसा पाऊस होईपर्यंत थांबा."
spray_ok_title: "फवारणीस योग्य दिवस"
spray_ok_text: "कीटकनाशक / बुरशीनाशक फवारणीस योग्य दिवस: {days}."
spray_ok_action: "वारा शांत असताना सकाळी फवारणी करा; पावसापूर्वी ६ तास फवारणी टाळा."
spray_no_title: "फवारणी पुढे ढकला"
spray_no_text: "पुढील सर्व दिवस पाऊस किंवा जोराचा वारा अपेक्षित आहे."
spray_no_action: "फवारणी व पानांवरील खते पुढे ढकला; औषध वाहून जाईल किंवा उडून जाईल."
fert_avoid_title: "खताचा हप्ता पुढे ढकला"
fert_avoid_text: "पुढील ४८ तासांत {rain2} मिमी पाऊस अपेक्षित आहे."
fert_avoid_action: "जोराचा पाऊस संपेपर्यंत युरिया / वरखत देऊ नका, अन्यथा अन्नद्रव्ये वाहून जातील."
heat_title: "उष्णतेचा ताण"
heat_text: "{day} रोजी कमाल तापमान {tmax} °से पर्यंत जाण्याची शक्यता."
heat_action: "संध्याकाळी पाणी द्या, जनावरांना सावली व पिण्याचे पाणी द्या, दुपारी १२ ते ४ शेतकाम टाळा."
cold_title: "थंडीची लाट"
cold_text: "{day} रोजी किमान तापमान {tmin} °से पर्यंत घसरू शकते."
cold_action: "संध्याकाळी हलके पाणी द्या, रोपवाटिका झाका, जनावरांना रात्री निवाऱ्यात ठेवा."
frost_title: "दव / हिमाचा धोका"
frost_text: "{day} रोजी किमान तापमान {tmin} °से पर्यंत घसरू शकते; सखल खोऱ्यातील शेतांना जास्त धोका."
frost_action: "आदल्या संध्याकाळी पाणी द्या, रोपे झाका, पहाटे वाऱ्याच्या दिशेने धूर करा."
thunder_title: "मेघगर्जना व वीज"
thunder_text: "{day} रोजी मेघगर्जनेसह पावसाची शक्यता (१५.६ मिमी किंवा अधिक पावसाची शक्यता: {prob}%)."
thunder_action: "वादळात उघड्या शेतात व झाडाखाली थांबू नका; जनावरे गोठ्यात ठेवा; काढलेले पीक सुरक्षित ठेवा."
wind_title: "जोराचा वारा"
wind_text: "{day} रोजी ताशी {wind} किमी वेगाने वारे वाहण्याची शक्यता."
wind_action: "ऊस, केळी यांसारख्या उंच पिकांना आधार द्या; फवारणी करू नका; पॉलिहाऊस व शेडनेट सुरक्षित करा."
pest_fungal_title: "कीड व बुरशीजन्य रोगांचा धोका"
pest_fungal_text: "उष्ण व दमट हवामान ({tmax} °से पर्यंत, आर्द्रता {rh}%) कीड व बुरशीजन्य रोगांना पोषक आहे."
pest_fungal_action: "पिकांची नियमित पाहणी करा; कोरड्या व शांत सकाळी गरजेनुसार प्रतिबंधात्मक फवारणी करा."
harvest_ok_title: "काढणीस योग्य वेळ"
harvest_ok_text: "{n} दिवस कोरडे हवामान अपेक्षित - {crop} काढणी व वाळवणीसाठी योग्य."
harvest_ok_action: "तयार पिकाची काढणी करा व साठवणीपूर्वी चांगले वाळवा."
harvest_no_title: "काढणी पुढे ढकला"
harvest_no_text: "{crop} काढणीच्या काळात पावसाची शक्यता आहे."
harvest_no_action: "काढणी पुढे ढकला; काढलेला माल झाकलेल्या उंच जागी हलवा."
crop_stage_line: "{crop} - {stage}"

