summary_dry: "Mainly dry weather is expected over the next {n} days (total {total} mm)."
summary_light: "Light rain is likely on {n_days} of the next {n} days (total {total} mm)."
summary_moderate: "Moderate rain is likely on {n_days} of the next {n} days (total {total} mm)."
