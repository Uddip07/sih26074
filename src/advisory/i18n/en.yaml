diseases:
  grape_downy_mildew: {name: "Downy mildew", action: "Spray a protective fungicide (e.g. mancozeb or copper) before the rain; improve canopy ventilation."}
  grape_powdery_mildew: {name: "Powdery mildew", action: "Spray wettable sulphur or a recommended systemic fungicide; remove affected leaves."}
  onion_thrips: {name: "Thrips", action: "Monitor with blue sticky traps; spray recommended insecticide if more than 30 thrips per plant."}
  onion_purple_blotch: {name: "Purple blotch", action: "Spray a recommended fungicide with sticker; ensure field drainage."}
  pomegranate_bacterial_blight: {name: "Bacterial blight (oily spot)", action: "Remove and destroy infected fruits and twigs; spray a recommended bactericide + copper after rain."}
  rice_blast: {name: "Blast", action: "Avoid excess nitrogen; spray a recommended fungicide at first symptoms."}
  potato_late_blight: {name: "Late blight", action: "Spray a protective fungicide immediately; repeat after rain."}
  soybean_rust: {name: "Rust", action: "Scout lower leaves; spray a recommended fungicide at first pustules."}
  wheat_rust: {name: "Rust", action: "Grow resistant varieties; spray a recommended fungicide when rust appears."}

