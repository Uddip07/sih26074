[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agromet-downscaling"
version = "2.0.0"
description = "Block-to-Gram-Panchayat downscaling of weather forecasts for agro-meteorological advisories (SIH 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9", "rasterio>=1.3", "rasterstats>=0.19",
  "pyarrow>=15", "duckdb>=1.0", "pandas>=2.2", "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4",
  "xgboost>=2.0", "optuna>=3.6", "xarray>=2024.1", "netCDF4>=1.6", "requests>=2.31", "pyyaml>=6.0",
  "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.28", "python-multipart>=0.0.9", "matplotlib>=3.8",
  "fpdf2>=2.7.9", "uharfbuzz>=0.39", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
agromet-pipeline = "src.pipeline.run:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.advisory" = ["i18n/*.yaml", "fonts/*.ttf", "fonts/OFL.txt"]
"src.dashboard" = ["templates/*.html", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scratch", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: needs the pipeline outputs in data/ and outputs/ (skipped when absent)"]
